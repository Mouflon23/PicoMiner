[workspace]
resolver = "3"
members = ["core", "firmware"]
default-members = ["core"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/Mouflon23/PicoMiner"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
debug = 1
panic = "abort"

[profile.dev]
opt-level = 1